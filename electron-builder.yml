appId: ua.vasyafamily.launcher
productName: Vasya Family Launcher
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target: nsis
  artifactName: VasyaFamilyLauncher-Setup-${version}.${ext}
  # App icon: build/icon.png (512x512, rendered from the Season 1 banner).
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Vasya Family Launcher
publish:
  provider: github
  owner: Volodrum
  repo: Vasya_Family_Launcher
  releaseType: release
