appId: ua.vasyafamily.launcher
productName: Vasya Family Launcher
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target: nsis
  artifactName: VasyaFamilyLauncher-Setup-${version}.${ext}
  # Put a 256x256 (or larger) build/icon.png here to replace the default Electron icon.
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Vasya Family Launcher
publish:
  provider: github
  owner: Volodrum
  repo: Vasya_Family_Launcher
  releaseType: release
