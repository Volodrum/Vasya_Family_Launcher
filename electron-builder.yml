appId: ua.vasyafamily.launcher
productName: Vasya Family Launcher
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target: nsis
  artifactName: VasyaFamilyLauncher-Setup-${version}.${ext}
  # App icon: the pixel "double-rim V" logo, drawn by tools/make-icon.mjs (build/icon.ico, build/icon.png).
  icon: build/icon.ico
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  shortcutName: Vasya Family Launcher
publish:
  provider: github
  owner: Volodrum
  repo: Vasya_Family_Launcher
  releaseType: release
